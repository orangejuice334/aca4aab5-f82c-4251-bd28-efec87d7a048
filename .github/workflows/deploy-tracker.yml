# Deploy the tracker/ subdirectory to GitHub Pages.
# Uploaded artifact root = ./tracker so the served URL is
#   https://<user>.github.io/<repo>/track.html
# (with the repo name in the path, but no extra "/tracker/" segment).

name: Deploy tracker to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "tracker/**"
      - ".github/workflows/deploy-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "tracker"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
